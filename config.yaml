# ── Paths (auto-updated at runtime by notebook — do not edit manually) ──
paths:
    train_val_dir: "" # set by notebook after platform detection
    artifacts_dir: "" # set by notebook after platform detection

# ── W&B ──────────────────────────────────────────────────────────────────
wandb:
    project_name: "pneumonia-detection"

# ── Data ─────────────────────────────────────────────────────────────────
data:
    val_size: 0.2
    pos_weight: 0.673

# ── Dataloader ────────────────────────────────────────────────────────────
dataloader:
    batch_size: 32
    num_workers: 2

# ── Training ─────────────────────────────────────────────────────────────
training:
    epochs: 5
    device: null # resolved at runtime: cuda if available, else cpu

# ── Optimizer ────────────────────────────────────────────────────────────
optimizer:
    tf_lr: 0.001
    ft_lr: 0.00001
    lr_decay: 0.2
    n_layers: 1

# ── Model ─────────────────────────────────────────────────────────────────
model:
    num_classes: 1 # binary classification → single logit output
